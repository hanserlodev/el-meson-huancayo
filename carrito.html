<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tu pedido en El Mesón: revísalo y envíalo por WhatsApp al 939 399 946." />
  <link rel="icon" href="imagenes/logo.jpg" />
  <title>Carrito — El Mesón, Pollos y Parrillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body data-page="carrito" class="font-sans text-slate-800 antialiased">
  <div id="site-header"></div>

  <main class="max-w-6xl mx-auto px-4 pt-10">
    <p class="text-xs font-bold uppercase tracking-[0.18em] text-brand-600">Tu pedido</p>
    <h1 class="font-display text-3xl md:text-4xl font-extrabold text-ink mt-1 mb-6">Carrito de compras</h1>

    <div class="grid gap-6 lg:grid-cols-3">
      <div class="lg:col-span-2 bg-white rounded-2xl ring-1 ring-slate-900/5 shadow-card p-5 md:p-6 flex flex-col min-h-[320px]">
        <div id="lista-carrito" class="space-y-3" aria-live="polite"></div>
        <div class="mt-auto pt-10">
          <a href="carta.html" class="inline-block w-full border-t border-slate-100 pt-4 text-sm font-semibold text-brand-700 hover:underline">← Seguir comprando</a>
        </div>
      </div>
      <aside class="bg-ink text-white rounded-2xl p-6 h-fit shadow-card lg:sticky lg:top-24">
        <h2 class="font-display text-lg font-bold">Resumen</h2>
        <dl class="mt-4 space-y-2 text-sm">
          <div class="flex justify-between"><dt class="text-slate-300">Subtotal</dt><dd class="font-bold">S/ <span id="res-sub">0.00</span></dd></div>
          <div class="flex justify-between"><dt class="text-slate-300">Delivery</dt><dd class="font-bold">S/ <span id="res-del">0.00</span></dd></div>
          <div class="flex justify-between border-t border-white/10 pt-3 text-base"><dt class="font-bold">Total</dt><dd class="font-bold text-amber-300">S/ <span id="monto-total">0.00</span></dd></div>
        </dl>
        <p id="envio-msg" class="mt-3 text-xs text-slate-300"></p>
        <div class="mt-5 space-y-2">
          <button id="btn-whatsapp" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-400 hover:-translate-y-0.5 active:translate-y-0 transition-all">Pedir por WhatsApp</button>
          <button id="btn-pagar" class="w-full bg-white/10 border border-white/15 py-3 rounded-xl font-semibold hover:bg-white hover:text-ink transition-all">Confirmar aquí ✓</button>
          <button id="btn-vaciar" class="w-full text-slate-400 text-sm py-1 hover:text-white transition-colors">Vaciar carrito</button>
        </div>
        <p class="mt-4 text-xs text-slate-400">El pedido llega al WhatsApp del local (939 399 946) listo para enviar.</p>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="bg-ink text-white px-5 py-3 rounded-full shadow-pop font-semibold text-sm" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // Resumen con delivery: gratis desde el umbral (lo llama cart.js al renderizar).
    window.Resumen = function () {
      const sub = window.Cart.total();
      const gratis = sub >= window.Meson.ENVIO_GRATIS_DESDE || sub === 0;
      const del = sub === 0 ? 0 : (gratis ? 0 : window.Meson.DELIVERY);
      document.getElementById("res-sub").textContent = window.Cart.soles(sub);
      document.getElementById("res-del").textContent = window.Cart.soles(del);
      document.getElementById("monto-total").textContent = window.Cart.soles(sub + del);
      document.getElementById("envio-msg").textContent = sub === 0
        ? "Agrega platos para calcular el delivery."
        : (gratis ? "Tienes delivery GRATIS." : `Te faltan S/ ${(window.Meson.ENVIO_GRATIS_DESDE - sub).toFixed(2)} para el delivery gratis.`);
    };
    window.Resumen();
  </script>
</body>
</html>
